# Manual release of @strevokit/meeting-sdk to the public npm registry, with npm provenance.
# verify:  every check and release guard, then packs the tarball and runs a dry-run publish (no approval needed).
# publish: real runs only; waits for approval in the npm-release environment, then publishes the exact tarball
#          verify produced and tags the release meeting-sdk-v<version>. If that version is already on npm with the
#          same contents (an earlier run failed after publishing), it only pushes the tag.
# Auth: NPM_PUBLISH_AUTH=token (default) uses the NPM_TOKEN environment secret; NPM_PUBLISH_AUTH=oidc uses npm
# trusted publishing (no secret). Switching needs no change to this file.
name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every check and pack the package without publishing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.guards.outputs.version }}
      tag: ${{ steps.guards.outputs.tag }}
      tarball: ${{ steps.pack.outputs.tarball }}
      integrity: ${{ steps.pack.outputs.integrity }}
      sha: ${{ github.sha }}
    steps:
      - name: Ref guard
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases run only from main."
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            packages/signaling-protocol/package-lock.json
            packages/meeting-sdk/package-lock.json

      - run: bash ./scripts/ci/sdk.sh lint
      - run: bash ./scripts/ci/sdk.sh static-analysis
      - run: bash ./scripts/ci/sdk.sh unit
      - run: bash ./scripts/ci/sdk.sh integration
      - run: bash ./scripts/ci/sdk.sh build
      - run: bash ./scripts/ci/sdk.sh security

      - name: Release guards
        id: guards
        working-directory: packages/meeting-sdk
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          license="$(node -p "require('./package.json').license")"
          version="$(node -p "require('./package.json').version")"
          tag="meeting-sdk-v${version}"
          if [ "$license" = "UNLICENSED" ] || [ ! -f LICENSE ] || [ ! -f ../../LICENSE ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::warning::License not set; a real release will stop here."
            else
              echo "::error::Choose a license before publishing (package.json license and LICENSE files)."
              exit 1
            fi
          fi
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::Tag ${tag} already exists; bump the version."
            exit 1
          fi
          npm run check:release
          npm run check:publish-hygiene
          node scripts/check-publish-hygiene.mjs --tree ../..
          echo "version=${version}" >>"$GITHUB_OUTPUT"
          echo "tag=${tag}" >>"$GITHUB_OUTPUT"

      - name: Pack and dry-run publish
        id: pack
        working-directory: packages/meeting-sdk
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --json --pack-destination "$RUNNER_TEMP/release" >"$RUNNER_TEMP/pack.json"
          tarball="$(node -p "require(process.argv[1])[0].filename" "$RUNNER_TEMP/pack.json")"
          integrity="$(node -p "require(process.argv[1])[0].integrity" "$RUNNER_TEMP/pack.json")"
          npm publish "$RUNNER_TEMP/release/$tarball" --dry-run --access public
          echo "tarball=${tarball}" >>"$GITHUB_OUTPUT"
          echo "integrity=${integrity}" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-tarball
          path: ${{ runner.temp }}/release/${{ steps.pack.outputs.tarball }}
          retention-days: 1
          if-no-files-found: error

      - name: Summary
        env:
          VERSION: ${{ steps.guards.outputs.version }}
          TAG: ${{ steps.guards.outputs.tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "### Release verify"
            echo "- Version: \`${VERSION}\` (tag \`${TAG}\`)"
            echo "- Tarball: \`${TARBALL}\`"
            echo ""
            echo '```text'
            tar -tzf "$RUNNER_TEMP/release/$TARBALL"
            echo '```'
            if [ "$DRY_RUN" = "true" ]; then echo "Dry run: nothing published."; fi
          } >>"$GITHUB_STEP_SUMMARY"

  publish:
    needs: verify
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Credential guard
        env:
          AUTH_MODE: ${{ vars.NPM_PUBLISH_AUTH || 'token' }}
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          set -euo pipefail
          case "$AUTH_MODE" in
            token)
              if [ "$HAS_TOKEN" != "true" ]; then
                echo "::error::NPM_TOKEN is not set in the npm-release environment (or set NPM_PUBLISH_AUTH=oidc after configuring npm trusted publishing)."
                exit 1
              fi
              ;;
            oidc) ;;
            *)
              echo "::error::NPM_PUBLISH_AUTH must be token or oidc."
              exit 1
              ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or later; token mode works with it too.
      - run: npm install -g npm@^11.5.1

      # A rerun after a failed tag push finds the version already on npm: tag it without republishing.
      - name: Registry check
        id: registry
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          INTEGRITY: ${{ needs.verify.outputs.integrity }}
        run: |
          set -euo pipefail
          anonymous="$(mktemp)"
          if published="$(npm view "@strevokit/meeting-sdk@${VERSION}" dist.integrity --userconfig "$anonymous" 2>"$RUNNER_TEMP/view.log")"; then
            :
          elif grep -q E404 "$RUNNER_TEMP/view.log"; then
            published=""
          else
            cat "$RUNNER_TEMP/view.log" >&2
            echo "::error::Could not check the npm registry for ${VERSION}."
            exit 1
          fi
          if [ -z "$published" ]; then
            echo "published=false" >>"$GITHUB_OUTPUT"
          elif [ "$published" = "$INTEGRITY" ]; then
            echo "::notice::${VERSION} is already on npm with the verified contents; tagging without publishing."
            echo "published=true" >>"$GITHUB_OUTPUT"
          else
            echo "::error::Version ${VERSION} is already on npm with different contents; bump the version."
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.registry.outputs.published != 'true'
        with:
          name: release-tarball
          path: ${{ runner.temp }}/release

      - name: Publish
        if: steps.registry.outputs.published != 'true'
        env:
          AUTH_MODE: ${{ vars.NPM_PUBLISH_AUTH || 'token' }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ needs.verify.outputs.tarball }}
        run: |
          set -euo pipefail
          if [ "$AUTH_MODE" = "token" ]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          fi
          npm publish "$RUNNER_TEMP/release/$TARBALL" --provenance --access public

      - name: Tag release
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          git tag "$TAG" "$SHA"
          git push origin "$TAG"

      - name: Summary
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
          AUTH_MODE: ${{ vars.NPM_PUBLISH_AUTH || 'token' }}
          ALREADY_PUBLISHED: ${{ steps.registry.outputs.published }}
        run: |
          {
            echo "### Published"
            if [ "$ALREADY_PUBLISHED" = "true" ]; then echo "Already on npm from an earlier run; only the tag was pushed."; fi
            echo "- https://www.npmjs.com/package/@strevokit/meeting-sdk/v/${VERSION}"
            echo "- Tag: \`${TAG}\`"
            echo "- Auth: \`${AUTH_MODE}\`"
          } >>"$GITHUB_STEP_SUMMARY"
